[project]
name = "FlightRadarAPI"
dynamic = ["version"]
description = "SDK for FlightRadar24 with Cloudflare bypass support"
authors = [
    { name = "DimaD16", email = "dimitry.rouaix@gmail.com" },
]
license = "MIT"
readme = "README.md"
keywords = ["flightradar24", "api", "radar", "aviation", "flights", "airports", "airlines", "aircraft", "cloudflare"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
exclude = ["tests", ".flake8"]
requires-python = ">=3.7"
dependencies = [
  "Brotli",
  "requests",
  "beautifulsoup4",
]

[tool.hatch.build.targets.wheel]
packages = ["FlightRadar24"]

[project.optional-dependencies]
tests = [
  "pytest",
]

[project.urls]
"Homepage" = "https://github.com/DimaD16/FlightRadarAPI"
"Source Code" = "https://github.com/DimaD16/FlightRadarAPI"
"Bug Reports" = "https://github.com/DimaD16/FlightRadarAPI/issues"

[tool.hatch.version]
path = "FlightRadar24/__init__.py"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
