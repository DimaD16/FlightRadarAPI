name: NPM Publish

on:
  release:
    types: [created]
  workflow_dispatch:

defaults:
  run:
    working-directory: ./nodejs

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Run tests
        run: npm test
        env:
          FR24_PROXY_URL: ${{ secrets.FR24_PROXY_URL }}
          
      - name: Publish to NPM
        run: npm publish --access public --provenance
